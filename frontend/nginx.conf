server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8m;  # profile photo uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness probe for the container healthcheck; answered by nginx alone.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Resolve "backend" through Docker's DNS at request time (cached 10s) instead of once at
    # startup: when Watchtower recreates the backend container it may get a new IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location ~ ^/(api|django-admin|django-static|media)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other route is handled by React Router.
    location / {
        try_files $uri /index.html;
    }
}
