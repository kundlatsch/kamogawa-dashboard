name: chacao-boxing

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chacao}
      POSTGRES_USER: ${POSTGRES_USER:-chacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chacao}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      POSTGRES_HOST: db
    # Dev: auto-reloading server on top of the mounted source.
    command: sh -c "python manage.py migrate --noinput && python manage.py ensure_admin && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media-data:/app/media
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  media-data:
  frontend-node-modules:
